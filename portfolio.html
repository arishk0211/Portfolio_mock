/* ─────────────────────────────────────────────

function makeStars(n,spread,sz,col,opacity=0.9){
  const geo=new THREE.BufferGeometry();
  const p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    p[i*3]=(Math.random()-.5)*spread;
    p[i*3+1]=(Math.random()-.5)*spread;
    p[i*3+2]=(Math.random()-.5)*spread;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  return new THREE.Points(geo,new THREE.PointsMaterial({
    color:col,size:sz,transparent:true,opacity,sizeAttenuation:true,
    blending:THREE.AdditiveBlending,depthWrite:false
  }));
}

function nebula(x,y,z,scale,col,op){
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,col);g.addColorStop(0.5,col.replace(')',',0.25)').replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.position.set(x,y,z);sp.scale.set(scale,scale,1);
  return sp;
}

function galaxy(cx,cy,cz,arms,ppa,r,sz,col){
  const total=arms*ppa;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(total*3);
  let i=0;
  for(let a=0;a<arms;a++){
    const base=(a/arms)*Math.PI*2;
    for(let p=0;p<ppa;p++){
      const t=p/ppa;
      const angle=base+t*2.5+(Math.random()-.5)*0.5;
      const rad=t*r;
      pos[i++]=cx+Math.cos(angle)*rad+(Math.random()-.5)*3;
      pos[i++]=cy+(Math.random()-.5)*2;
      pos[i++]=cz+Math.sin(angle)*rad+(Math.random()-.5)*3;
    }
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  return new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:sz,transparent:true,opacity:0.45,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false}));
}

/* ─────────────────────────────────────────────

───────────────────────────────────────────── */
function makeTex(baseHex){
  const cv=document.createElement('canvas');cv.width=cv.height=512;
  const ctx=cv.getContext('2d');
  const r=(baseHex>>16)&0xff,g=(baseHex>>8)&0xff,b=baseHex&0xff;
  const gr=ctx.createRadialGradient(200,180,30,256,256,280);
  gr.addColorStop(0,`rgb(${Math.min(255,r+70)},${Math.min(255,g+70)},${Math.min(255,b+70)})`);
  gr.addColorStop(0.6,`rgb(${r},${g},${b})`);
  gr.addColorStop(1,`rgb(${Math.max(0,r-60)},${Math.max(0,g-60)},${Math.max(0,b-60)})`);
  ctx.fillStyle=gr;ctx.fillRect(0,0,512,512);
  // hex grid
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.8;
  for(let row=0;row<20;row++)for(let col=0;col<20;col++){
    const hx=col*32+(row%2)*16,hy=row*28;
    ctx.beginPath();
    for(let k=0;k<6;k++){const a=Math.PI/3*k-Math.PI/6;(k?ctx.lineTo:ctx.moveTo)(hx+Math.cos(a)*13,hy+Math.sin(a)*13)}
    ctx.closePath();ctx.stroke();
  }
  // scanlines
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
  for(let y=0;y<512;y+=4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(512,y);ctx.stroke()}
  // glint dots
  ctx.fillStyle='rgba(255,255,255,0.15)';
  for(let i=0;i<40;i++){ctx.beginPath();ctx.arc(Math.random()*512,Math.random()*512,Math.random()*3+0.5,0,Math.PI*2);ctx.fill()}
  return new THREE.CanvasTexture(cv);
}

/* ─────────────────────────────────────────────

function makeLabel(text,fontSize=32){
  const cv=document.createElement('canvas');cv.width=512;cv.height=80;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,512,80);
  ctx.font=`bold ${fontSize}px Orbitron,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#f5c842';ctx.shadowBlur=18;
  ctx.fillStyle='#f5c842';ctx.fillText(text,256,40);
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillText(text,256,40);
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(4.5,0.72,1);
  return sp;
}

function drawPhotoLayer(imgEl){
  pCtx.clearRect(0,0,512,512);
  pCtx.save();
  pCtx.beginPath();pCtx.arc(256,256,240,0,Math.PI*2);pCtx.clip();
  if(imgEl) pCtx.drawImage(imgEl,0,0,512,512);
  else{
    pCtx.fillStyle='#101020';pCtx.fill();
    pCtx.font='bold 160px sans-serif';
    pCtx.fillStyle='#f5c842';pCtx.textAlign='center';pCtx.textBaseline='middle';
    pCtx.fillText('A',256,280);
  }
  pCtx.restore();
  // ring
  pCtx.beginPath();pCtx.arc(256,256,240,0,Math.PI*2);
  pCtx.strokeStyle='rgba(245,200,66,0.6)';pCtx.lineWidth=8;pCtx.stroke();
  photoTex.needsUpdate=true;
}

/* ─────────────────────────────────────────────
   BUILD PLANETS
───────────────────────────────────────────── */
const planetMeshes=[];
const orbitLines=[];
const planetLabels=[];

PLANETS.forEach((pd,i)=>{
  /* Orbit ring */
  const oCurve=new THREE.EllipseCurve(0,0,pd.orbitR,pd.orbitR*0.92,0,Math.PI*2,false,pd.tilt*0.2);
  const oPts=oCurve.getPoints(128).map(p=>new THREE.Vector3(p.x,0,p.y));
  const oGeo=new THREE.BufferGeometry().setFromPoints(oPts);
  const oLine=new THREE.Line(oGeo,new THREE.LineBasicMaterial({color:0xf5c842,transparent:true,opacity:0.08}));
  oLine.rotation.x=Math.PI/2*0.1+pd.tilt*0.1;
  scene.add(oLine);
  orbitLines.push(oLine);

  /* Planet mesh */
  const geo=new THREE.SphereGeometry(pd.size,64,64);
  const tex=makeTex(pd.col);
  const mat=new THREE.MeshPhysicalMaterial({
    map:tex,metalness:0.5,roughness:0.22,clearcoat:1.0,clearcoatRoughness:0.05,
    emissive:pd.emissive,emissiveIntensity:0.18
  });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.userData={pd,index:i};
  mesh.castShadow=true;

  /* Ring (Saturn-style) for Skills planet */
  if(pd.rings){
    const rg=new THREE.RingGeometry(pd.size*1.45,pd.size*2.1,64);
    const rm=new THREE.MeshBasicMaterial({color:pd.col,transparent:true,opacity:0.22,side:THREE.DoubleSide,depthWrite:false});
    const ring=new THREE.Mesh(rg,rm);
    ring.rotation.x=Math.PI/2.2;
    mesh.add(ring);
  }

  /* Moon */
  const moonGeo=new THREE.SphereGeometry(pd.size*0.22,16,16);
  const moonMat=new THREE.MeshPhysicalMaterial({color:0xaaaaaa,metalness:0.3,roughness:0.7,emissive:0x444444,emissiveIntensity:0.1});
  const moon=new THREE.Mesh(moonGeo,moonMat);
  moon.userData._isMoon=true;
  mesh.add(moon);

  /* Group to handle orbit */
  const pivot=new THREE.Group();
  pivot.add(mesh);
  pivot.rotation.y=pd.phase;
  scene.add(pivot);

  // position planet on orbit
  mesh.position.set(pd.orbitR,0,0);

  /* Label sprite above planet */
  const lbl=makeLabel(pd.label,28);
  lbl.position.set(0,pd.size+0.9,0);
  mesh.add(lbl);

  planetMeshes.push({mesh,pivot,pd,lbl,moon});
});

/* ─────────────────────────────────────────────
   CAMERA STATE MACHINE
───────────────────────────────────────────── */
const STATE={SOLAR:0,FLYING:1,FOCUSED:2,RETURNING:3};
let state=STATE.SOLAR;
let focusedPlanet=null;

const camTarget  ={x:0,y:28,z:55};   // lerp target position
const camLookAt  ={x:0,y:0,z:0};     // lerp lookat
const lerpSpeed  = 0.055;

function flyToPlanet(pm){
  if(state===STATE.FLYING||state===STATE.FOCUSED) return;
  state=STATE.FLYING;
  focusedPlanet=pm;
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('hint').style.opacity='0';
  document.getElementById('title-hud').style.opacity='0';

  // compute world position of planet
  const wp=new THREE.Vector3();
  pm.mesh.getWorldPosition(wp);

  // target: slightly in front of planet
  const dir=wp.clone().normalize();
  const dist=pm.pd.size*5.5+4;
  camTarget.x=wp.x+dir.x*dist*0.3;
  camTarget.y=wp.y+2;
  camTarget.z=wp.z+dist;
  camLookAt.x=wp.x;camLookAt.y=wp.y;camLookAt.z=wp.z;
}

function flyBack(){
  if(state===STATE.RETURNING||state===STATE.SOLAR) return;
  state=STATE.RETURNING;
  closePanel();
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('hint').style.opacity='1';
  document.getElementById('title-hud').style.opacity='1';
  camTarget.x=0;camTarget.y=28;camTarget.z=55;
  camLookAt.x=0;camLookAt.y=0;camLookAt.z=0;
  autoRotate=true;
  focusedPlanet=null;
}
window.flyBack=flyBack;

function openPanel(pd){
  document.getElementById('panel-icon').textContent=pd.icon;
  document.getElementById('panel-title').textContent=pd.label;
  document.getElementById('panel-body').innerHTML=pd.content;
  document.getElementById('section-panel').classList.add('open');
}
function closePanel(){
  document.getElementById('section-panel').classList.remove('open');
}

/* ─────────────────────────────────────────────
   ORBIT CONTROLS  (manual)
───────────────────────────────────────────── */
let isDrag=false,prevMX=0,prevMY=0;
let orbX=0.5,orbY=0,autoRotate=true;
let autoTimer=null;

canvas.addEventListener('mousedown',e=>{isDrag=true;prevMX=e.clientX;prevMY=e.clientY;autoRotate=false;clearTimeout(autoTimer)});
window.addEventListener('mouseup',()=>{isDrag=false;if(state===STATE.SOLAR)autoTimer=setTimeout(()=>autoRotate=true,5000)});
canvas.addEventListener('mousemove',e=>{
  if(!isDrag)return;
  orbY+=(e.clientX-prevMX)*0.006;
  orbX+=(e.clientY-prevMY)*0.003;
  orbX=Math.max(0.1,Math.min(1.3,orbX));
  prevMX=e.clientX;prevMY=e.clientY;
});

// Zoom scroll (only in SOLAR mode)
canvas.addEventListener('wheel',e=>{
  if(state!==STATE.SOLAR)return;
  camTarget.z+=e.deltaY*0.04;
  camTarget.z=Math.max(20,Math.min(120,camTarget.z));
},{passive:true});

// Touch
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDrag=true;prevMX=e.touches[0].clientX;prevMY=e.touches[0].clientY;autoRotate=false;clearTimeout(autoTimer)}
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!isDrag||e.touches.length!==1)return;
  orbY+=(e.touches[0].clientX-prevMX)*0.006;
  orbX+=(e.touches[0].clientY-prevMY)*0.003;
  orbX=Math.max(0.1,Math.min(1.3,orbX));
  prevMX=e.touches[0].clientX;prevMY=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',()=>{isDrag=false;if(state===STATE.SOLAR)autoTimer=setTimeout(()=>autoRotate=true,5000)},{passive:true});

/* ─────────────────────────────────────────────
   RAYCASTER
───────────────────────────────────────────── */
const rc=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let hoveredMesh=null;
const tip=document.getElementById('tip');

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  rc.setFromCamera(mouse,cam);

  const meshOnly=planetMeshes.map(p=>p.mesh);
  const hits=rc.intersectObjects(meshOnly,true);

  if(hits.length){
    // find root planet mesh
    let obj=hits[0].object;
    while(obj.parent&&!obj.userData.pd)obj=obj.parent;
    if(obj.userData.pd){
      tip.style.opacity='1';
      tip.style.left=e.clientX+14+'px';
      tip.style.top=e.clientY+14+'px';
      tip.textContent=obj.userData.pd.label;
      canvas.style.cursor='pointer';
      if(hoveredMesh&&hoveredMesh!==obj){unhover(hoveredMesh)}
      hoveredMesh=obj;
      obj.material.emissiveIntensity=0.55;
      obj.scale.set(1.12,1.12,1.12);
    }
  } else {
    tip.style.opacity='0';
    if(hoveredMesh){unhover(hoveredMesh);hoveredMesh=null}
    canvas.style.cursor=isDrag?'grabbing':'grab';
  }
});

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  rc.setFromCamera(mouse,cam);
  const meshOnly=planetMeshes.map(p=>p.mesh);
  const hits=rc.intersectObjects(meshOnly,true);
  if(hits.length){
    let obj=hits[0].object;
    while(obj.parent&&!obj.userData.pd)obj=obj.parent;
    if(obj.userData.pd){
      const pm=planetMeshes.find(p=>p.mesh===obj);
      if(pm){
        if(state===STATE.SOLAR){
          flyToPlanet(pm);
        } else if(state===STATE.FOCUSED&&focusedPlanet===pm){
          // already focused — ignore or could expand
        }
      }
    }
  }
});

function unhover(obj){
  if(!obj)return;
  obj.material.emissiveIntensity=0.18;
  obj.scale.set(1,1,1);
}

/* ─────────────────────────────────────────────
   RESIZE
───────────────────────────────────────────── */
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
});

/* ─────────────────────────────────────────────
   SOLAR ORBIT  camera rig (for free orbit view)
───────────────────────────────────────────── */
const camRig=new THREE.Group();
scene.add(camRig);

/* ─────────────────────────────────────────────
   ANIMATION LOOP
───────────────────────────────────────────── */
const _look=new THREE.Vector3();
const _pos=new THREE.Vector3();
let panelOpened=false;

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const dt=clock.getDelta();

  /* ── orbit planets ── */
  planetMeshes.forEach(({mesh,pivot,pd,lbl,moon})=>{
    pivot.rotation.y+=pd.speed*0.004;
    mesh.rotation.y=t*0.25;
    mesh.rotation.x=Math.sin(t*0.1)*0.1;
    // moon orbit
    moon.position.x=Math.cos(t*(0.5+pd.speed))*( pd.size*2.2);
    moon.position.z=Math.sin(t*(0.5+pd.speed))*( pd.size*2.2);
    moon.position.y=Math.sin(t*(0.4+pd.speed))*( pd.size*0.6);
    // label always faces camera
    lbl.quaternion.copy(cam.quaternion);
  });

  /* ── central star ── */
  starMesh.rotation.y=t*0.08;
  photoMesh.rotation.y=t*0.08;
  const ss=1+Math.sin(t*1.2)*0.03;
  starGroup.scale.set(ss,ss,ss);
  starGroup.rotation.y=t*0.04;
  nameLabel.quaternion.copy(cam.quaternion);

  /* ── background rotations ── */
  starsA.rotation.y=t*0.005;starsA.rotation.x=t*0.002;
  starsB.rotation.y=-t*0.003;
  starsC.rotation.z=t*0.003;
  gal1.rotation.y=t*0.008;gal2.rotation.y=-t*0.006;gal3.rotation.y=t*0.005;

  /* ── camera state ── */
  if(state===STATE.SOLAR){
    if(autoRotate) orbY+=0.0015;
    // spherical orbit
    const camDist=camTarget.z;
    _pos.set(
      Math.sin(orbY)*Math.cos(orbX)*camDist,
      Math.sin(orbX)*camDist*0.8,
      Math.cos(orbY)*Math.cos(orbX)*camDist
    );
    cam.position.lerp(_pos,0.06);
    _look.set(0,0,0);
    cam.lookAt(_look);

  } else if(state===STATE.FLYING||state===STATE.RETURNING){
    // lerp camera to target
    _pos.set(camTarget.x,camTarget.y,camTarget.z);
    cam.position.lerp(_pos,lerpSpeed);
    _look.set(camLookAt.x,camLookAt.y,camLookAt.z);
    const currLook=new THREE.Vector3();
    cam.getWorldDirection(currLook);
    const targetDir=_look.clone().sub(cam.position).normalize();
    const lerpedDir=currLook.lerp(targetDir,0.05).normalize();
    cam.lookAt(cam.position.clone().add(lerpedDir.multiplyScalar(10)));

    // check arrival
    if(cam.position.distanceTo(_pos)<0.6){
      if(state===STATE.FLYING){
        state=STATE.FOCUSED;
        panelOpened=false;
        autoRotate=false;
      } else if(state===STATE.RETURNING){
        state=STATE.SOLAR;
        panelOpened=false;
      }
    }
  } else if(state===STATE.FOCUSED){
    if(focusedPlanet){
      // keep camera looking at planet even as it orbits
      const wp=new THREE.Vector3();
      focusedPlanet.mesh.getWorldPosition(wp);
      const dir=wp.clone().sub(cam.position).normalize();
      const dist=focusedPlanet.pd.size*5.5+4;
      _pos.set(wp.x+dir.x*0.3,wp.y+2,wp.z+dist*0.6);
      cam.position.lerp(_pos,0.035);
      cam.lookAt(wp);

      // open panel once settled
      if(!panelOpened){
        openPanel(focusedPlanet.pd);
        panelOpened=true;
      }
    }
  }

  renderer.render(scene,cam);
}

animate();
})();
</script>
